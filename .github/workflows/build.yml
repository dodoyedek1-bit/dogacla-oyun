name: DOĞAÇLA Mobil Build (Gömülü Videolarla)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Repodaki Kodu Al
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Java Kurulumu (Android İçin)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 1. Ortam ve Paket Kurulumu
      run: |
        set -e
        mkdir dogacla-mobil
        cd dogacla-mobil
        mkdir src
        
        cat << 'EOF' > package.json
        {
          "name": "dogacla-mobil",
          "private": true,
          "version": "1.0.0",
          "type": "module",
          "scripts": { "build": "vite build" },
          "dependencies": {
            "@capacitor/android": "^6.0.0",
            "@capacitor/core": "^6.0.0",
            "firebase": "^10.8.1",
            "lucide-react": "^0.360.0",
            "react": "^18.2.0",
            "react-dom": "^18.2.0"
          },
          "devDependencies": {
            "@capacitor/cli": "^6.0.0",
            "@vitejs/plugin-react": "^4.2.1",
            "autoprefixer": "^10.4.16",
            "postcss": "^8.4.32",
            "tailwindcss": "^3.4.0",
            "vite": "^5.0.8"
          }
        }
        EOF
        
        cat << 'EOF' > vite.config.js
        import { defineConfig } from 'vite'
        import react from '@vitejs/plugin-react'
        export default defineConfig({ 
          base: './', 
          build: { target: 'es2015' },
          plugins: [react()] 
        })
        EOF
        
        cat << 'EOF' > tailwind.config.js
        export default { content: ["./index.html", "./src/**/*.{js,ts,jsx,tsx}"], theme: { extend: {} }, plugins: [], }
        EOF
        
        cat << 'EOF' > postcss.config.js
        export default { plugins: { tailwindcss: {}, autoprefixer: {} } }
        EOF
        
        npm install
        
        cat << 'EOF' > index.html
        <!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>DOĞAÇLA</title>
            <style>
              body { background-color: #0a0a0a; margin: 0; padding: 0; }
              #error-log { display: none; background: #900; color: white; padding: 20px; font-family: monospace; word-break: break-all; position: absolute; z-index: 9999; top: 0; left: 0; right: 0; }
            </style>
            <script>
              window.onerror = function(msg, src, lineno, colno, error) {
                var el = document.getElementById('error-log');
                el.style.display = 'block';
                el.innerHTML += '<b>HATA:</b> ' + msg + '<br><b>SATIR:</b> ' + lineno + '<br><hr>';
              };
            </script>
            <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
            <script>eruda.init();</script>
          </head>
          <body>
            <div id="error-log"></div>
            <div id="root"></div>
            <script type="module" src="/src/main.jsx"></script>
          </body>
        </html>
        EOF
        
        cat << 'EOF' > src/main.jsx
        import React from 'react'
        import ReactDOM from 'react-dom/client'
        import App from './App.jsx'
        import './index.css'
        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
        EOF
        
        cat << 'EOF' > src/index.css
        @tailwind base;
        @tailwind components;
        @tailwind utilities;
        EOF
        
        if [ -f "../App.jsx" ]; then
          cp ../App.jsx src/App.jsx
        else
          exit 1
        fi

    - name: 2. Videoları ve Görselleri İndirip Uygulamaya Göm
      run: |
        cd dogacla-mobil
        cat << 'EOF' > downloadAssets.mjs
        import fs from 'fs';
        import https from 'https';
        
        const path = './src/App.jsx';
        let code = fs.readFileSync(path, 'utf8');
        const urls = code.match(/https:\/\/raw\.githubusercontent\.com[^"']+/g) || [];
        const uniqueUrls = [...new Set(urls)];
        
        if (uniqueUrls.length > 0) {
            fs.mkdirSync('./public/assets', { recursive: true });
            
            async function downloadAll() {
                for (const url of uniqueUrls) {
                    const filename = decodeURIComponent(url.split('/').pop());
                    code = code.split(url).join('./assets/' + filename);
                    
                    await new Promise((resolve) => {
                        https.get(url, (res) => {
                            if (res.statusCode === 200) {
                                const file = fs.createWriteStream('./public/assets/' + filename);
                                res.pipe(file);
                                file.on('finish', () => { file.close(); resolve(); });
                            } else {
                                resolve();
                            }
                        }).on('error', (e) => {
                            resolve();
                        });
                    });
                }
                fs.writeFileSync(path, code);
            }
            await downloadAll();
        }
        EOF
        node downloadAssets.mjs
        rm downloadAssets.mjs

    - name: 3. Android Çıktısını Hazırla ve APK İkonunu Göm
      run: |
        cd dogacla-mobil
        npx cap init "Dogacla" "com.oyun.dogacla" --web-dir dist
        npm run build
        npx cap add android
        
        wget -O raw_icon.png "https://raw.githubusercontent.com/dodoyedek1-bit/Dogacla-Oyunu/main/dogacla_logsu.png"
        
        sudo apt-get update && sudo apt-get install -y imagemagick
        convert raw_icon.png -resize 700x700 -background none -gravity center -extent 1024x1024 dogacla_icon.png
        
        for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          cp dogacla_icon.png android/app/src/main/res/mipmap-$density/ic_launcher.png
          cp dogacla_icon.png android/app/src/main/res/mipmap-$density/ic_launcher_round.png
          cp dogacla_icon.png android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png 2>/dev/null || true
        done
        
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: 4. APK'yı Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Dogacla-Oyun-APK
        path: dogacla-mobil/android/app/build/outputs/apk/debug/app-debug.apk
